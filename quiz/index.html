<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="welcome">
    <h1>Welcome to the JavaScript Quiz!</h1>
    <button id="startQuiz">Start Quiz</button>
</div>

<div id="quiz">
    <div id="timer">Time Remaining: <span id="time">30</span> seconds</div>
    <div id="question-container"></div>
    <button id="prev" onclick="prevQuestion()">Previous</button>
    <button id="next" onclick="nextQuestion()">Next</button>
</div>

<div id="result">
    <h1>Your Result</h1>
    <p id="score"></p>
    <button id="restart" onclick="restartQuiz()">Restart Quiz</button>
</div>

<script src="app.js"></script>
</body>
</html>
